name: Linter and Formatter Check

on:
  pull_request:
    branches:
      - main

jobs:
  backend_quality_code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Check Formatter PHP with Pint
        run: composer format:check

  frontend_quality_code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Check Formatter Frontend
        run: npm run format:check

      - name: Check Linter Frontend
        run: npm run lint
